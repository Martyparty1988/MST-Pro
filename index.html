<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
  <link rel="apple-touch-icon" href="/icon-192.svg" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.svg" />
  <link rel="apple-touch-icon" sizes="167x167" href="/icon-192.svg" />

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MST">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#020617" />

  <meta name="description"
    content="Profesionální PWA nástroj pro správu solárních montáží, docházky, projektů a týmů. Funguje offline.">
  <title>MST - Martyho Solar Tracker</title>

  <link rel="manifest" href="/manifest.json" />

  <style>
    /* Critical CSS for immediate dark splash screen appearance */
    html,
    body {
      background-color: #020617;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #splash-loader {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #020617 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
      pointer-events: none;
    }

    #splash-content {
      text-align: center;
      animation: pulse 2s infinite ease-in-out;
    }

    .splash-logo {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 3.5rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.05em;
      color: white;
      margin: 0;
      text-transform: uppercase;
    }

    .splash-dot {
      color: #6366f1;
      font-style: normal;
    }

    .splash-bar {
      width: 50px;
      height: 3px;
      background: #6366f1;
      margin: 1rem auto;
      border-radius: 99px;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.7;
        transform: scale(0.98);
      }

      50% {
        opacity: 1;
        transform: scale(1.02);
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>

<body>
  <div id="splash-loader">
    <div id="splash-content">
      <h1 class="splash-logo">MST<span class="splash-dot">.</span></h1>
      <div class="splash-bar"></div>
    </div>
  </div>

  <div id="root"></div>

  <script type="module" src="/index.tsx"></script>

  <script>
    // Remove splash screen once React is mounted
    window.addEventListener('load', () => {
      const loader = document.getElementById('splash-loader');
      if (loader) {
        setTimeout(() => {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 600);
        }, 500);
      }
    });
  </script>
</body>

</html>
